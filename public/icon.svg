<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00D2D3"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0F0F1A"/>
  <!-- Progress ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="8" fill="#E8E8F0"/>
  <!-- Clock hand pointing to ~2 o'clock (60 degrees from 12) -->
  <line x1="256" y1="256" x2="342" y2="170" stroke="#E8E8F0" stroke-width="12" stroke-linecap="round"/>
</svg>
