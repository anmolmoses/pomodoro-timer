name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Build
        run: npm run build

      - name: Check publish directory
        run: |
          PUBLISH_DIR="./dist"
          if [ ! -d "$PUBLISH_DIR" ] && [ "$PUBLISH_DIR" != "./" ] && [ "$PUBLISH_DIR" != "." ]; then
            echo "⚠️ Publish dir '$PUBLISH_DIR' not found. Checking alternatives..."
            for dir in dist build out public .; do
              if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
                echo "✅ Found '$dir' with index.html"
                echo "PUBLISH_DIR=$dir" >> $GITHUB_ENV
                exit 0
              fi
            done
            if [ -f "index.html" ]; then
              echo "✅ Found index.html in root"
              echo "PUBLISH_DIR=." >> $GITHUB_ENV
            else
              echo "❌ No deployable directory found"
              ls -la
              exit 1
            fi
          else
            echo "PUBLISH_DIR=$PUBLISH_DIR" >> $GITHUB_ENV
          fi

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ${{ env.PUBLISH_DIR || './dist' }}
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
